"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = 'p10k'
# Safety net for the git-status.sh / kube-context.sh / azure-sub.sh scripts,
# which still run their own subprocess occasionally (once per command / once
# per typed-command-word change, not per redraw). 500ms default is tight in
# large repos or when kube-context.sh falls back to `kubectl`.
command_timeout = 2000

# IMPORTANT: top-level keys (format, add_newline, palette) MUST come before any
# [table] header, otherwise TOML nests them inside that table and Starship
# silently ignores `format` and falls back to its default layout.
#
# Line 1:  (dir) > (git) >  ····  (right-side pills) < (dur time)
# Line 2:  prompt arrow
#
# The git segment is green when the work tree is clean (or has only untracked
# files, matching p10k) and yellow when there are staged/unstaged changes. To
# keep the per-second clock refresh cheap (no forked shell per redraw), the
# git status is computed once per command by a precmd hook in .zshrc, which
# exports the final display text directly into $STARSHIP_GIT_CLEAN_TEXT /
# $STARSHIP_GIT_DIRTY_TEXT / $STARSHIP_NO_GIT. The [env_var.*] modules below
# just read those vars in-process (env_var never forks a shell).
#
# Every right-side pill works the same way: a hook in .zshrc computes its text
# (once per command, or once per typed-command-word change for show-on-command
# pills), exports it as $STARSHIP_<NAME>_TEXT, and the matching [env_var.*]
# module renders it only while that variable is set. Pills have no closing
# triangle; each draws its entrance with `bg:prev_bg` (the background of
# whatever segment precedes it -- the fill, or another pill), so any subset of
# them joins up cleanly, and the time group's entrance in `format` does the
# same. To add a pill, export a new variable from .zshrc, add an [env_var.*]
# block here in that shape, and list it in `format`. Neighbouring pills should
# have different colours, or the join between them is invisible.
format = """
[](fg:blue)\
$directory\
${env_var.git_clean}\
${env_var.git_dirty}\
${env_var.dir_sep}\
$fill\
${env_var.jobs}\
${env_var.venv}\
${env_var.pyenv}\
${env_var.nvm}\
${env_var.kube}\
${env_var.terraform}\
${env_var.azure}\
${env_var.context}\
${env_var.context_root}\
[](fg:grey bg:prev_bg)\
$cmd_duration\
$status\
$time\
[](fg:grey)\
$line_break\
$character"""

# Colours pulled from the Alacritty theme so Starship matches the terminal.
[palettes.p10k]
blue    = '#82a9fe' # directory / venv background
bright_blue = '#2b63ff' # azure background
yellow  = '#ffcc02' # git background (dirty) / pyenv / context text
green   = '#70bf47' # git background (clean / untracked-only) / nvm
grey    = '#f0f0f0' # time / duration background (light grey)
magenta = '#bd2bac' # kubernetes background
pink    = '#f08dde' # terraform background
cyan    = '#88ddff' # background-jobs background
red     = '#f88c6c' # context background when root
light   = '#ffffff' # light text (dir / kube / azure)
dark    = '#1c1e2b' # text on light pills / context background
dots    = '#585858' # connecting dots

[directory]
style = 'fg:light bg:blue'
format = '[ $path ]($style)'
truncation_length = 0
truncate_to_repo = false
home_symbol = '~'

# Git segment (green when clean, yellow when dirty). Implemented as two
# mutually-exclusive env_var modules -- Starship module styles are static, so
# a conditional background needs two modules, one per state. Both just read
# the text the .zshrc precmd hook computes once per command (no git call, and
# no forked shell at all, on the per-second clock redraw).
[env_var.git_clean]
variable = 'STARSHIP_GIT_CLEAN_TEXT'
format = '[](fg:blue bg:green)[ $env_value ](fg:dark bg:green)[](fg:green)'

[env_var.git_dirty]
variable = 'STARSHIP_GIT_DIRTY_TEXT'
format = '[](fg:blue bg:yellow)[ $env_value ](fg:dark bg:yellow)[](fg:yellow)'

# Closing triangle for the directory segment when NOT in a git repo (the git
# modules above provide their own blue->colour triangle when they render).
# $STARSHIP_NO_GIT is exported by the same precmd hook only when outside a
# work tree, so this and the two modules above are mutually exclusive.
[env_var.dir_sep]
variable = 'STARSHIP_NO_GIT'
format = '[](fg:blue)'

[fill]
symbol = '·'
style = 'fg:dots'

# --- Right-side pills -------------------------------------------------------
# Listed in display order. See the comment above `format` for how they work.

# Background jobs (cyan, icon only, like p10k's non-verbose background_jobs).
# $STARSHIP_JOBS_TEXT holds the job count (unused here; it just needs to be
# non-empty), refreshed once per command.
[env_var.jobs]
variable = 'STARSHIP_JOBS_TEXT'
format = '[](fg:cyan bg:prev_bg)[  ](fg:dark bg:cyan)'

# Python virtual environment (blue, like p10k's virtualenv segment). A generic
# env dir name (env, venv, .venv, virtualenv) is replaced by its parent
# directory's name, so `python3 -m venv env` in ~/ziggy shows "ziggy".
[env_var.venv]
variable = 'STARSHIP_VENV_TEXT'
format = '[](fg:blue bg:prev_bg)[  $env_value ](fg:dark bg:blue)'

# pyenv Python version (yellow). Shown only when the version selected by
# $PYENV_VERSION or a .python-version file differs from the global one.
[env_var.pyenv]
variable = 'STARSHIP_PYENV_TEXT'
format = '[](fg:yellow bg:prev_bg)[  $env_value ](fg:dark bg:yellow)'

# nvm Node.js version (green). Shown only when it differs from `nvm alias
# default` (e.g. after `nvm use`).
[env_var.nvm]
variable = 'STARSHIP_NVM_TEXT'
format = '[](fg:green bg:prev_bg)[  $env_value ](fg:dark bg:green)'

# Kubernetes context (magenta). Shown only while typing a kube command; the
# .zshrc show-on-command hook runs kube-context.sh once per change of the
# typed command's first word.
[env_var.kube]
variable = 'STARSHIP_KUBE_TEXT'
format = '[](fg:magenta bg:prev_bg)[ ⎈ $env_value ](fg:light bg:magenta)'

# Terraform (pink). Shows the workspace whenever it is not "default", plus the
# terraform version while typing a terraform/tf command.
[env_var.terraform]
variable = 'STARSHIP_TERRAFORM_TEXT'
format = '[](fg:pink bg:prev_bg)[ 󱁢 $env_value ](fg:dark bg:pink)'

# Azure subscription (bright blue). Shown only while typing an azure/IaC
# command; populated the same way as kube, via azure-sub.sh.
[env_var.azure]
variable = 'STARSHIP_AZURE_TEXT'
format = '[](fg:bright_blue bg:prev_bg)[ 󰠅 $env_value ](fg:light bg:bright_blue)'

# user@host, only over SSH (yellow on dark) or as root (on red), like p10k's
# context segment. Set once at shell startup.
[env_var.context]
variable = 'STARSHIP_CONTEXT_TEXT'
format = '[](fg:dark bg:prev_bg)[ $env_value ](fg:yellow bg:dark)'

[env_var.context_root]
variable = 'STARSHIP_CONTEXT_ROOT_TEXT'
format = '[](fg:red bg:prev_bg)[ $env_value ](bold fg:dark bg:red)'

[cmd_duration]
min_time = 3000
show_milliseconds = false
style = 'fg:dark bg:grey'
format = '[  $duration ]($style)'

[status]
disabled = false
style = 'fg:dark bg:grey'
symbol = ' '
format = '[$symbol$status ]($style)'

[time]
disabled = false
time_format = '%H:%M:%S'
style = 'fg:dark bg:grey'
format = '[ $time ]($style)'

[character]
success_symbol = '[❯](bold #70bf47)'
error_symbol = '[❯](bold #f88c6c)'
vimcmd_symbol = '[❮](bold #70bf47)'
