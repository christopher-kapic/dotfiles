"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = 'p10k'
# Safety net for the git-status.sh / kube-context.sh / azure-sub.sh scripts,
# which still run their own subprocess occasionally (once per command / once
# per typed-command-word change, not per redraw). 500ms default is tight in
# large repos or when kube-context.sh falls back to `kubectl`.
command_timeout = 2000

# IMPORTANT: top-level keys (format, add_newline, palette) MUST come before any
# [table] header, otherwise TOML nests them inside that table and Starship
# silently ignores `format` and falls back to its default layout.
#
# Line 1:  (dir) > (git) >  ····  (kube|azure) < (dur time)
# Line 2:  prompt arrow
#
# The git segment is green when the work tree is clean (or has only untracked
# files, matching p10k) and yellow when there are staged/unstaged changes. To
# keep the per-second clock refresh cheap (no forked shell per redraw), the
# git status is computed once per command by a precmd hook in .zshrc, which
# exports the final display text directly into $STARSHIP_GIT_CLEAN_TEXT /
# $STARSHIP_GIT_DIRTY_TEXT / $STARSHIP_NO_GIT. The [env_var.*] modules below
# just read those vars in-process (env_var never forks a shell).
#
# kube/azure use p10k-style "show on command": the zle hook in .zshrc detects
# the first word of the command being typed, runs kube-context.sh/azure-sub.sh
# at most once per change, and exports the result into $STARSHIP_KUBE_TEXT /
# $STARSHIP_AZURE_TEXT / $STARSHIP_NO_PILL. To add a new show-on-command
# segment, extend the case statement in .zshrc's _starship_show_on_command and
# add a matching [env_var.*] block here.
format = """
[](fg:blue)\
$directory\
${env_var.git_clean}\
${env_var.git_dirty}\
${env_var.dir_sep}\
$fill\
${env_var.kube}\
${env_var.azure}\
${env_var.grey_sep}\
$cmd_duration\
$status\
$time\
[](fg:grey)\
$line_break\
$character"""

# Colours pulled from the Alacritty theme so Starship matches the terminal.
[palettes.p10k]
blue    = '#82a9fe' # directory / azure background
yellow  = '#ffcc02' # git background (dirty)
green   = '#70bf47' # git background (clean / untracked-only)
grey    = '#f0f0f0' # time / duration background (light grey)
magenta = '#bd2bac' # kubernetes background
light   = '#ffffff' # light text (dir / kube / azure)
dark    = '#1c1e2b' # text on green / yellow / grey
dots    = '#585858' # connecting dots

[directory]
style = 'fg:light bg:blue'
format = '[ $path ]($style)'
truncation_length = 0
truncate_to_repo = false
home_symbol = '~'

# Git segment (green when clean, yellow when dirty). Implemented as two
# mutually-exclusive env_var modules -- Starship module styles are static, so
# a conditional background needs two modules, one per state. Both just read
# the text the .zshrc precmd hook computes once per command (no git call, and
# no forked shell at all, on the per-second clock redraw).
[env_var.git_clean]
variable = 'STARSHIP_GIT_CLEAN_TEXT'
format = '[](fg:blue bg:green)[ $env_value ](fg:dark bg:green)[](fg:green)'

[env_var.git_dirty]
variable = 'STARSHIP_GIT_DIRTY_TEXT'
format = '[](fg:blue bg:yellow)[ $env_value ](fg:dark bg:yellow)[](fg:yellow)'

# Closing triangle for the directory segment when NOT in a git repo (the git
# modules above provide their own blue->colour triangle when they render).
# $STARSHIP_NO_GIT is exported by the same precmd hook only when outside a
# work tree, so this and the two modules above are mutually exclusive.
[env_var.dir_sep]
variable = 'STARSHIP_NO_GIT'
format = '[](fg:blue)'

[fill]
symbol = '·'
style = 'fg:dots'

# Kubernetes context (magenta pill). Shown only while typing a kube command.
# $STARSHIP_KUBE_TEXT is populated once (not per redraw) by the .zshrc
# show-on-command hook, which runs kube-context.sh only when the typed
# command's first word changes. Trailing triangle connects the pill straight
# into the grey time group.
[env_var.kube]
variable = 'STARSHIP_KUBE_TEXT'
format = '[](fg:magenta)[ ⎈ $env_value ](fg:light bg:magenta)[](fg:grey bg:magenta)'

# Azure subscription (blue pill). Shown only while typing an azure command.
# $STARSHIP_AZURE_TEXT is populated the same way, via azure-sub.sh.
[env_var.azure]
variable = 'STARSHIP_AZURE_TEXT'
format = '[](fg:blue)[ 󰠅 $env_value ](fg:light bg:blue)[](fg:grey bg:blue)'

# Plain grey entrance triangle for the time group -- rendered only when no
# show-on-command pill is active (the pills provide their own grey
# transition). $STARSHIP_NO_PILL is exported by the same .zshrc hook whenever
# neither kube nor azure is active.
[env_var.grey_sep]
variable = 'STARSHIP_NO_PILL'
format = '[](fg:grey)'

[cmd_duration]
min_time = 3000
show_milliseconds = false
style = 'fg:dark bg:grey'
format = '[  $duration ]($style)'

[status]
disabled = false
style = 'fg:dark bg:grey'
symbol = ' '
format = '[$symbol$status ]($style)'

[time]
disabled = false
time_format = '%H:%M:%S'
style = 'fg:dark bg:grey'
format = '[ $time ]($style)'

[character]
success_symbol = '[❯](bold #70bf47)'
error_symbol = '[❯](bold #f88c6c)'
vimcmd_symbol = '[❮](bold #70bf47)'
